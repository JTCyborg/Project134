name: AMI486 full ROM disassembly

on:
  push:
    branches: [main]
    paths:
      - "ami486.bin"
      - ".github/workflows/ami486-full-disasm.yml"
      - "analysis/disasm/DISASM_INDEX.md"
      - "tools/disasm_ami486_candidate_windows.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  disassemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Capstone
        run: python3 -m pip install --break-system-packages capstone
      - name: Generate and verify complete linear 16-bit listing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from capstone import Cs, CS_ARCH_X86, CS_MODE_16
          from pathlib import Path
          import hashlib

          rom = Path("ami486.bin").read_bytes()
          if len(rom) != 65536:
              raise SystemExit(f"Expected 65536 ROM bytes, got {len(rom)}")
          sha = hashlib.sha256(rom).hexdigest()
          md = Cs(CS_ARCH_X86, CS_MODE_16)
          md.detail = False
          out = []
          off = 0
          while off < len(rom):
              ins = next(md.disasm(rom[off:], off, count=1), None)
              if ins is None or ins.size < 1 or off + ins.size > len(rom):
                  chunk = rom[off:off+1]
                  out.append(f"{off:08X}  {chunk.hex().upper():<16} db 0x{chunk[0]:02X}")
                  off += 1
              else:
                  chunk = rom[off:off+ins.size]
                  mnemonic = ins.mnemonic
                  # In 16-bit mode, unprefixed 98h/99h are CBW/CWD, not CWDE/CDQ.
                  if ins.bytes == b"\x98":
                      mnemonic = "cbw"
                  elif ins.bytes == b"\x99":
                      mnemonic = "cwd"
                  out.append(f"{off:08X}  {chunk.hex().upper():<16} {mnemonic} {ins.op_str}".rstrip())
                  off += ins.size
          if off != 65536:
              raise SystemExit(f"Coverage failed at {off:05X}")
          Path("analysis/disasm/ami486_full_linear_16bit.disasm.txt").write_text("\n".join(out)+"\n")
          Path("analysis/disasm/ami486_full_linear_16bit.manifest.txt").write_text(
              "Target: ami486.bin\nSize: 65536 bytes\n"
              f"SHA-256: {sha}\nDecoder: Capstone x86 16-bit\n"
              f"Linear decode records: {len(out)}\nByte coverage: 0000-FFFF (65536/65536)\n"
              "Undecodable bytes are emitted as db; this is a linear decode, not code/data classification.\n"
          )
          print(f"Verified 65536/65536 bytes; {len(out)} records; SHA-256 {sha}")
          PY
      - name: Generate independently seeded candidate windows
        run: python3 tools/disasm_ami486_candidate_windows.py
      - name: Commit generated disassembly
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/disasm/ami486_full_linear_16bit.disasm.txt analysis/disasm/ami486_full_linear_16bit.manifest.txt analysis/disasm/ami486_candidate_windows_20261116.txt analysis/disasm/ami486_candidate_windows_20261116.manifest.txt
          if git diff --cached --quiet; then
            echo "Disassembly is already current"
            exit 0
          fi
          git commit -m "Generate complete linear 16-bit AMI486 ROM disassembly"
          git pull --rebase origin main
          git push
